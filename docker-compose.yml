services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: texc-symphony:local
    restart: unless-stopped
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      PORT: "4000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4000/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  test:
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    command: "cargo test --locked"
    env_file:
      - .env
