{{- if .Values.networkPolicy.enabled }}
# Default-deny egress for the Symphony pod: DNS plus `networkPolicy.egress` only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "symphony.fullname" . }}-egress
  labels:
    {{- include "symphony.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "symphony.selector" . | nindent 6 }}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- with .Values.networkPolicy.egress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
