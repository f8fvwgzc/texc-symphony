# texc-symphony Helm values. See docs/deployment.md#option-3-kubernetes-helm.

image:
  repository: ghcr.io/f8fvwgzc/texc-symphony
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Symphony runs agents unattended and refuses to start without this acknowledgement. Review the
# sandbox and budget settings in `workflow` before setting it to true.
acknowledgeGuardrails: false

# WORKFLOW.md, mounted read-only at /config/WORKFLOW.md (front matter + prompt).
workflow: |
  ---
  tracker:
    kind: none
  server:
    port: 4000
  budget:
    max_tokens_per_day: 20000000
  ---
  You are working on {{ issue.identifier }}: {{ issue.title }}

# Replicas. More than one needs `database` (PostgreSQL): replicas coordinate through dispatch
# leases there, and each pod then keeps its logs and workspaces on its own emptyDir volumes.
replicaCount: 1

# PostgreSQL run history (SYMPHONY_DATABASE_URL) from an existing Secret; "" keeps SQLite on the
# data volume.
database:
  existingSecret: ""
  key: url

# The API token (required: the pod binds 0.0.0.0). An existing Secret holding it under `key`.
apiToken:
  existingSecret: symphony-api-token
  key: token

# Extra environment (tracker credentials, ...), as Kubernetes `env` entries.
extraEnv: []
# Extra `envFrom` sources.
extraEnvFrom: []
# Extra volumes and their mounts in the Symphony container (for example the GitHub App key of
# `isolation.github_app`, from a Secret mounted read-only at /var/run/secrets/github-app; give
# it `defaultMode: 0400`: `isolation.github_app` refuses a key the task uids could read).
extraVolumes: []
extraVolumeMounts: []

# Multi-tenant task runs: an `isolation:` section in the workflow front matter (task runs only;
# see docs/configuration.md#isolation):
#   isolation:
#     task_uids: {first: 200000, count: 1000}  # own uid per task: needs root (podSecurityContext
#                                              # runAsUser: 0, runAsNonRoot: false) and the
#                                              # capabilities listed at containerSecurityContext
#     github_app:                              # repository-scoped token per task
#       app_id: 123456
#       private_key_file: /var/run/secrets/github-app/private-key.pem   # via extraVolumes
#     network: {mode: deny, allow: []}         # default deny: git host:443 + LLM gateway
# Symphony's egress proxy confines every task process (the api shell in bubblewrap, Codex and Claude
# Code in a bubblewrap network jail), which needs a seccomp profile that allows user namespaces;
# `networkPolicy` below adds a pod-level layer.

# The platform LLM connection contract (LLM_*), shared by every core.
global:
  llm:
    # Non-secret settings come from this ConfigMap (keys LLM_PROVIDER, LLM_BASE_URL, LLM_MODEL,
    # LLM_MODEL_SMALL, LLM_TIMEOUT_SECS, LLM_MAX_RETRIES, LLM_GATEWAY_URL); optional.
    configMap: llm-config
    # Credentials come from this Secret, mounted read-only at /var/run/secrets/llm; optional.
    secret: llm-credentials
    # Secret keys: the provider key (LLM_API_KEY_FILE) and the gateway token
    # (LLM_GATEWAY_TOKEN_FILE). Set a key to "" when it is not used (a keyless local server).
    apiKeySecretKey: api-key
    gatewayTokenSecretKey: gateway-token
    # Explicit values win over the ConfigMap; "" leaves a variable to the ConfigMap.
    provider: ""
    baseUrl: ""
    model: ""
    modelSmall: ""
    timeoutSecs: ""
    maxRetries: ""
    gatewayUrl: ""

service:
  type: ClusterIP
  port: 4000

persistence:
  # Run history (SQLite) and logs.
  data:
    size: 5Gi
  # Per-issue and per-task workspaces.
  workspaces:
    size: 20Gi
  storageClass: ""

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    memory: 8Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# The Symphony container's securityContext. `isolation.task_uids` needs root with
# `capabilities: {drop: [ALL], add: [SETUID, SETGID, CHOWN, KILL, DAC_OVERRIDE, FOWNER]}`
# (switch to, signal and clean up after the task users).
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# Pod egress control. When enabled, the pod may only reach DNS (kube-dns, UDP/TCP 53) and the
# `egress` rules listed here: add the LLM gateway (or provider), the tracker API, the git host
# and, with `database`, the PostgreSQL server (TCP 5432).
# A pod-level layer under the per-task network jail of `isolation.network.mode: deny`.
networkPolicy:
  enabled: false
  # Extra NetworkPolicy egress rules, for example:
  #   - to:
  #       - podSelector: {matchLabels: {app.kubernetes.io/name: llm-gateway}}
  #     ports: [{protocol: TCP, port: 8080}]
  #   - to:
  #       - ipBlock: {cidr: 0.0.0.0/0, except: [10.0.0.0/8, 169.254.169.254/32]}
  #     ports: [{protocol: TCP, port: 443}]
  egress: []

nodeSelector: {}
tolerations: []
affinity: {}
