[package]
name = "symphony-store"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite persistence for Symphony runs, events, token usage and retention."

[dependencies]
chrono = { workspace = true }
# Bundled SQLite: identical builds on linux/amd64, linux/arm64 and macOS, no system libsqlite3.
rusqlite = { version = "0.40.2", features = ["bundled"] }
# PostgreSQL (several replicas sharing one database): sync client on the store thread, TLS via
# rustls with the system roots (the aws-lc-rs provider reqwest already uses).
postgres = "0.19.14"
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.45", default-features = false, features = ["std", "aws_lc_rs", "tls12"] }
rustls-native-certs = "0.8.4"
url = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[features]
# Exposes `Store::open_in_memory_shared` (a shared in-memory store) for other crates' tests only;
# never enabled by the production binary, so `is_postgres()` can never report true for SQLite.
test-util = []

[dev-dependencies]
tempfile = "3.27.0"
tokio = { workspace = true }

[lints]
workspace = true
