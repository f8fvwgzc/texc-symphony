[package]
name = "symphony-runtime"
description = "Symphony runtime: orchestrator actor, agent runner, workspace manager + hooks, SSH workers, supervisor and snapshots."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
symphony-core = { workspace = true }
symphony-trackers = { workspace = true }
symphony-codex = { workspace = true }
symphony-store = { workspace = true }
symphony-agents = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }
# Task credentials: GitHub App installation tokens (credentials.rs).
aws-lc-rs = { workspace = true }
base64 = { workspace = true }
reqwest = { workspace = true, features = ["json"] }

[target.'cfg(unix)'.dependencies]
# Safe `killpg` wrapper (the workspace forbids `unsafe`) and `O_NOFOLLOW` (isolation); same
# version as symphony-codex.
rustix = { version = "1.1.5", features = ["process", "fs"] }

[dev-dependencies]
tempfile = { workspace = true }
wiremock = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
