[package]
name = "symphony-server"
description = "Symphony HTTP server: Elixir-compatible /api/v1 JSON API, SSE live updates, run history endpoints and the embedded web dashboard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
build = "build.rs"

[dependencies]
symphony-core = { workspace = true }
symphony-store = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
chrono = { workspace = true }
form_urlencoded = "1.2.2"
futures = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true, features = ["catch-panic", "compression-br", "compression-gzip", "cors", "normalize-path", "request-id", "set-header", "trace", "util"] }
tracing = { workspace = true }

[build-dependencies]
hex = { workspace = true }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
serde_yaml_ng = { workspace = true }
sha2 = { workspace = true }

[dev-dependencies]
jsonschema = { version = "0.58.5", default-features = false }
reqwest = { workspace = true, features = ["json"] }
serde_yaml_ng = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tower = { workspace = true, features = ["util"] }

[lints]
workspace = true
