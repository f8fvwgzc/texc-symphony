[package]
name = "symphony"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Symphony: turn tracker work into isolated, autonomous coding-agent runs"

# The library holds everything testable (CLI evaluation, bootstrap, terminal dashboard, the
# `workspace before-remove` subcommand); `main.rs` only calls it. A distinct lib name avoids the
# lib/bin output-name collision in `cargo doc`.
[lib]
name = "symphony_cli"
path = "src/lib.rs"

[[bin]]
name = "symphony"
path = "src/main.rs"

[dependencies]
symphony-agents = { workspace = true }
symphony-core = { workspace = true }
symphony-trackers = { workspace = true }
symphony-codex = { workspace = true }
symphony-runtime = { workspace = true }
symphony-store = { workspace = true }
symphony-server = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
clap = { workspace = true }
serde_json = { workspace = true }
rustls = { workspace = true }
thiserror = { workspace = true }
# io-std: `symphony agent-tools` serves MCP on stdin/stdout.
tokio = { workspace = true, features = ["io-std"] }
tokio-util = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
unicode-segmentation = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Terminal size (`tcgetwinsize`) and `PR_SET_DUMPABLE` without `unsafe`; same version as the
# other crates.
rustix = { version = "1.1.6", features = ["process", "termios", "fs"] }

[dev-dependencies]
assert_cmd = { workspace = true }
serde_json = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
# The load harness (benches/load): an SSE client over a real socket, and row counts read straight
# from the SQLite file (same version as symphony-store).
reqwest = { workspace = true }
rusqlite = { version = "0.41.1", features = ["bundled"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { version = "1.1.6", features = ["process", "termios", "fs"] }

# Load harness for the orchestrator and the store (docs/performance.md); never part of the binary.
[[bench]]
name = "load"
harness = false

[lints]
workspace = true
