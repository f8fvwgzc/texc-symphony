[package]
name = "symphony-codex"
description = "Symphony Codex app-server client: stdio JSON-RPC session, events, dynamic tools, token accounting."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
symphony-core = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Safe `killpg` wrapper (the workspace forbids `unsafe`); already in the lockfile via tempfile.
rustix = { version = "1.1.5", features = ["process"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true }
tracing-subscriber = { workspace = true }

[lints]
workspace = true
