[package]
name = "symphony-agents"
description = "Symphony agent backends: the AgentBackend abstraction, the Codex app-server adapter, the Claude Code CLI adapter and the built-in API agent loop (Anthropic Messages, OpenAI-compatible Chat Completions)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
symphony-core = { workspace = true }
symphony-codex = { workspace = true }
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
url = { workspace = true }

[target.'cfg(unix)'.dependencies]
# `O_NOFOLLOW` / `O_NONBLOCK` for the file tools.
libc = { workspace = true }
# Safe `killpg` wrapper (the workspace forbids `unsafe`); same version as symphony-codex.
rustix = { version = "1.1.5", features = ["process", "fs"] }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }

[lints]
workspace = true
