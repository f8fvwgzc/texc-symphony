openapi: 3.1.0
info:
  title: Symphony Observability API
  version: 1.0.0
  summary: Runtime state, live updates and run history for a Symphony orchestrator.
  description: |
    HTTP API served by the `symphony-server` crate (axum) when `server.port` (WORKFLOW.md) or
    `--port` is set. It binds `server.host` (default `127.0.0.1`).

    **Compatibility.** `GET /api/v1/state`, `POST /api/v1/refresh`, `GET /api/v1/{issue_identifier}`
    and the 404/405 error envelopes are byte-for-byte shape compatible with the Elixir reference
    implementation (Phoenix). Everything else is new in the Rust port:
    `health`, `events` (SSE), `runs`, `runs/{id}`, `runs/{id}/events`, `totals` and `/api/openapi.json`.

    **Routing rules** (in priority order, first match wins):

    1. Literal routes: `/api/v1/state`, `/api/v1/refresh`, `/api/v1/pause`, `/api/v1/resume`,
       `/api/v1/metrics`, `/api/v1/health`, `/api/v1/events`, `/api/v1/events/tickets`, `/api/v1/tasks`, `/api/v1/runs`, `/api/v1/totals`, `/api/openapi.json`. Their names are therefore reserved and
       can never be looked up as issue identifiers.
    2. `/api/v1/runs/{id}` and `/api/v1/runs/{id}/events`.
    3. `/api/v1/{issue_identifier}` (exactly one path segment, URL-decoded, case-sensitive).
    4. A defined path with an unsupported method answers `405` with code `method_not_allowed`.
       `HEAD` is accepted wherever `GET` is (empty body).
    5. The embedded web dashboard (`web/dist`) is served for `GET /` (`index.html`) and for each
       file in the bundle at its own path (`/assets/<hashed>.js|css`, `/favicon.png`). The
       dashboard uses hash routing (`/#/runs`), so no SPA fallback is needed.
    6. Anything else answers `404` with code `not_found` / message `Route not found`
       (e.g. `/unknown`, `/api/v1/a/b`, `POST /favicon.png`).

    A single trailing slash is ignored (`/api/v1/state/` == `/api/v1/state`). Request bodies are
    ignored unless an operation documents one.

    **Security.**

    * **Authentication.** When an API token is configured (`server.api_token` in WORKFLOW.md, or
      `SYMPHONY_API_TOKEN`), every `/api/*` request except `GET /api/v1/health` and
      `GET /api/openapi.json` needs `Authorization: Bearer <token>`; otherwise it answers `401`
      `unauthorized` with `WWW-Authenticate: Bearer realm="symphony"`. Without a token the API is
      open, and Symphony refuses to bind anything but a loopback address (`auth_required` at
      startup). The dashboard shell and its assets are public; the dashboard asks for the token.
    * **SSE tickets.** A browser `EventSource` cannot send headers, so clients first call
      `POST /api/v1/events/tickets` (authenticated) and open the stream with `?ticket=<ticket>`.
      A ticket is valid once, for 60 s, and only on stream endpoints.
    * **Host allow-list.** Requests whose `Host` is not loopback (`localhost`, `*.localhost`,
      `127.0.0.1`, `[::1]`), the bind address or a `server.allowed_hosts` entry answer `403`
      `host_not_allowed` (protection against DNS rebinding).
    * **Origin check.** Browser writes (`POST`) whose `Origin` is neither the request's own origin
      nor a `server.allowed_origins` entry, or that are marked `Sec-Fetch-Site: cross-site`,
      answer `403` `origin_not_allowed`.

    **Timestamps.** RFC 3339 / ISO 8601 UTC with a `Z` suffix, truncated to whole seconds
    (`2026-02-24T20:15:30Z`), except `requested_at` on refresh and the run-history timestamps,
    which carry sub-second precision (`2026-02-24T20:15:30.123456Z`).

    **Errors.** Every non-2xx response uses the envelope
    `{"error": {"code": "<machine code>", "message": "<human text>"}}`. Codes:
    `not_found`, `method_not_allowed`, `issue_not_found`, `orchestrator_unavailable`,
    `run_not_found`, `invalid_parameter`, `store_disabled`, `request_failed`, `unauthorized`,
    `host_not_allowed`, `origin_not_allowed`, `task_not_found`, `task_conflict`.
    `GET /api/v1/state` never fails with an error status: snapshot failures are reported inside a
    `200` body (`snapshot_timeout`, `snapshot_unavailable`).
  license:
    name: Apache-2.0
    identifier: Apache-2.0
security:
  - bearerAuth: []
servers:
  - url: http://127.0.0.1:4000
    description: Local orchestrator (port comes from `server.port` or `--port`)
tags:
  - name: tasks
    description: Work assigned directly by products, without a tracker issue (needs the run-history store).
  - name: state
    description: Live orchestrator state (Elixir compatible).
  - name: control
    description: Operator actions (Elixir compatible).
  - name: live
    description: Server-Sent Events stream of state snapshots.
  - name: history
    description: Run history persisted in SQLite (`symphony-store`). 503 `store_disabled` when persistence is off.
  - name: meta
    description: Health and API description.

paths:
  /api/v1/state:
    get:
      tags: [state]
      operationId: getState
      summary: Current orchestrator snapshot
      description: |
        Projection of the orchestrator snapshot. Always `200`: when the snapshot call times out
        (15 s) or the orchestrator is not running, the body is `StateError` instead of
        `StateSnapshot`. Lists are sorted by `issue_id`.
      responses:
        '200':
          description: Snapshot (or an in-band snapshot error).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatePayload'
              examples:
                snapshot:
                  $ref: '#/components/examples/StateSnapshot'
                timeout:
                  summary: Snapshot timed out
                  value:
                    generated_at: '2026-02-24T20:15:30Z'
                    error: { code: snapshot_timeout, message: Snapshot timed out }
                unavailable:
                  summary: Orchestrator not running
                  value:
                    generated_at: '2026-02-24T20:15:30Z'
                    error: { code: snapshot_unavailable, message: Snapshot unavailable }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/refresh:
    post:
      tags: [control]
      operationId: requestRefresh
      summary: Queue an immediate poll + reconcile cycle
      description: |
        Asks the orchestrator to run its next poll tick now. The request body is ignored (empty,
        `{}` or form-encoded are all fine). `coalesced` is `true` when a poll was already in
        progress or already due, in which case nothing new is scheduled. `GET` on this path is `405`.
      responses:
        '202':
          description: Refresh queued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshAccepted'
              example:
                queued: true
                coalesced: false
                requested_at: '2026-02-24T20:15:30.123456Z'
                operations: [poll, reconcile]
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          description: Orchestrator is not running (or did not answer within 5 s).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: { code: orchestrator_unavailable, message: Orchestrator is unavailable }

  /api/v1/pause:
    post:
      tags: [control]
      operationId: pauseDispatch
      summary: Engage the kill switch
      description: |
        Stops every running agent (their claims are released, so they run again after resume)
        and holds all dispatch, including retries, until `POST /api/v1/resume`. The state survives
        restarts (it is kept in the run-history store). `reason` is stored and reported in
        `spend.stopped_reason`.
      parameters:
        - name: reason
          in: query
          required: false
          schema: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Kill switch engaged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PauseState' }
              example: { paused: true, reason: runaway spend }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503':
          description: Orchestrator is not running (or did not answer within 5 s).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/resume:
    post:
      tags: [control]
      operationId: resumeDispatch
      summary: Release the kill switch
      responses:
        '200':
          description: Dispatch resumes (a poll is scheduled immediately).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PauseState' }
              example: { paused: false, reason: null }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }
        '503':
          description: Orchestrator is not running (or did not answer within 5 s).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/metrics:
    get:
      tags: [meta]
      operationId: getMetrics
      summary: Prometheus metrics
      description: |
        Prometheus text format (0.0.4): `symphony_up`, `symphony_running_agents`,
        `symphony_retrying_issues`, `symphony_blocked_issues`, `symphony_input_tokens`,
        `symphony_cached_input_tokens`, `symphony_output_tokens` and, with spend controls, `symphony_cost_usd`,
        `symphony_day_tokens`, `symphony_day_cost_usd`, `symphony_dispatch_paused`,
        `symphony_dispatch_stopped`. Needs the API token like every other endpoint.
      responses:
        '200':
          description: Metrics.
          content:
            text/plain:
              schema: { type: string }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '405': { $ref: '#/components/responses/MethodNotAllowed' }

  /api/v1/health:
    get:
      tags: [meta]
      operationId: getHealth
      summary: Liveness and build information
      description: Cheap check that never touches the orchestrator. Always `200` while the process serves HTTP. Never needs the API token.
      security: []
      responses:
        '200':
          description: Server is up.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example:
                status: ok
                version: 0.1.0
                uptime_seconds: 3725
                store: sqlite
                auth_required: true
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/events:
    get:
      tags: [live]
      operationId: streamEvents
      summary: Live snapshot stream (Server-Sent Events)
      description: |
        `text/event-stream` that pushes the same JSON as `GET /api/v1/state`.

        * The stream starts with `retry: 3000` and immediately sends one `snapshot` event.
        * A new `snapshot` is sent whenever the orchestrator state changes. Changes are debounced
          server-side (~200 ms, leading + trailing edge), so bursts of agent events produce at most
          ~5 snapshots per second.
        * `id:` is the orchestrator update *generation*, a monotonically increasing integer. Only
          `snapshot` events carry an `id`.
        * `event: heartbeat` is sent every 15 s (no `id`) so proxies keep the connection open and
          clients can detect a dead stream.
        * A reconnecting client that sends `Last-Event-ID` simply receives the current snapshot
          first; missed intermediate snapshots are never replayed (each snapshot is complete).
        * When a snapshot cannot be taken, the `snapshot` event carries a `StateError` body.

        Response headers: `Content-Type: text/event-stream`, `Cache-Control: no-cache`,
        `X-Accel-Buffering: no`.

        Wire example:

        ```text
        retry: 3000

        event: snapshot
        id: 42
        data: {"generated_at":"2026-02-24T20:15:30Z","counts":{"running":1,"retrying":0,"blocked":0},...}

        event: heartbeat
        data: {"at":"2026-02-24T20:15:45Z","generation":42}

        ```
      parameters:
        - name: ticket
          in: query
          required: false
          description: Single-use ticket from `POST /api/v1/events/tickets`, for clients that cannot send `Authorization` (browser `EventSource`).
          schema:
            type: string
        - name: Last-Event-ID
          in: header
          required: false
          description: Generation of the last snapshot seen. Accepted for compatibility; the current snapshot is always sent first.
          schema:
            type: string
      responses:
        '200':
          description: Event stream (never ends on its own).
          headers:
            Cache-Control:
              schema: { type: string, const: no-cache }
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Sequence of SSE frames. `event: snapshot` frames carry `StatePayload` JSON in `data`;
                  `event: heartbeat` frames carry `{"at": <timestamp>, "generation": <int>}`.
              x-sse-events:
                snapshot:
                  description: '`id:` = generation. `data:` = StatePayload JSON (same body as GET /api/v1/state).'
                  schema:
                    $ref: '#/components/schemas/StatePayload'
                heartbeat:
                  description: 'Every 15 s, no `id:`. `data:` = `{at, generation}` JSON.'
                  schema:
                    type: object
                    description: Payload of SSE `heartbeat` events.
                    required: [at, generation]
                    properties:
                      at: { $ref: '#/components/schemas/Timestamp' }
                      generation: { type: integer, minimum: 0, description: 'Latest generation (same as the last snapshot `id`).' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/events/tickets:
    post:
      tags: [live]
      operationId: createStreamTicket
      summary: Single-use ticket for opening an SSE stream
      description: |
        Returns a ticket to pass as `?ticket=` when opening a stream endpoint with a client that
        cannot send headers. Valid once, for 60 s. Works (and is harmless) without auth too.
      responses:
        '201':
          description: Ticket issued.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SseTicket'
              example:
                ticket: 6f1c0d3e9a8b7c6d5e4f3a2b1c0d9e8f7a6b5c4d3e2f1a0b9c8d7e6f5a4b3c2d
                expires_at: '2026-02-24T20:16:30.123456Z'
                expires_in_ms: 60000
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/v1/tasks:
    post:
      tags: [tasks]
      operationId: createTask
      summary: Queue a task
      description: |
        Queues work for an agent without a tracker issue. The task runs once, in a fresh workspace
        (empty, or a shallow clone of `repo`), on `backend` (default `agent.backend`), with the
        prompt sent as-is (wrapped by the backend's `prompt_template`). Its final agent message
        becomes `result`. Runs are recorded under the identifier `task-<id>`.

        With `depends_on`, the task is `waiting` until every listed task has succeeded, then
        `queued`. If one of them fails or is cancelled, the task fails too (`dependency task-<id>
        did not succeed`), and so do its own dependants. A dependency that is already failed or
        cancelled is refused (409).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskCreate' }
            example:
              title: Summarize the README
              prompt: Read README.md and write a five-line summary.
              repo: https://github.com/f8fvwgzc/texc-symphony
              backend: local
              limits: { max_tokens: 200000, timeout_ms: 600000 }
              metadata: { ticket: PROD-17 }
      responses:
        '201':
          description: Task queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A task in `depends_on` already failed or was cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: task_conflict, message: 'dependency task-3 is failed; unblock it first' }
        '503': { $ref: '#/components/responses/StoreDisabled' }
    get:
      tags: [tasks]
      operationId: listTasks
      summary: Tasks, newest first (keyset pagination)
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
        - { name: before_id, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: status, in: query, required: false, schema: { $ref: '#/components/schemas/TaskStatus' } }
      responses:
        '200':
          description: One page of tasks.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '503': { $ref: '#/components/responses/StoreDisabled' }

  /api/v1/tasks/plan:
    post:
      tags: [tasks]
      operationId: planTasks
      summary: Plan a set of tasks without creating or running them
      description: |
        A dry run of creating a set of tasks with dependencies. Each planned task has a client
        `key`; `depends_on` names other planned tasks (strings, their keys) and existing tasks
        (integers, their ids). Nothing is created or run. `waves` groups the keys so that each
        wave depends only on earlier ones (wave 0 on no planned task); `order` is the waves in
        sequence. Each task's `status` is what creating it now would give: `queued`, `waiting` on
        `waiting_for` (its planned dependencies and the existing ones that have not succeeded), or
        `failed` because `failed_dependency` already failed or was cancelled (directly or through a
        planned dependency; creating it would be refused). An unknown key or id, a duplicate key
        or a dependency cycle is a 400 that names it. At most 1000 tasks.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskPlanRequest' }
            example:
              tasks:
                - { key: build }
                - { key: test, depends_on: [build] }
                - { key: deploy, depends_on: [test, 41] }
      responses:
        '200':
          description: The plan.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPlan' }
              example:
                order: [build, test, deploy]
                waves: [[build], [test], [deploy]]
                tasks:
                  - { key: build, wave: 0, status: queued, waiting_for: [], failed_dependency: null }
                  - { key: test, wave: 1, status: waiting, waiting_for: [build], failed_dependency: null }
                  - { key: deploy, wave: 2, status: waiting, waiting_for: [test, 41], failed_dependency: null }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '503': { $ref: '#/components/responses/StoreDisabled' }

  /api/v1/tasks/{id}:
    get:
      tags: [tasks]
      operationId: getTask
      summary: One task
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: The task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '503': { $ref: '#/components/responses/StoreDisabled' }

  /api/v1/tasks/{id}/cancel:
    post:
      tags: [tasks]
      operationId: cancelTask
      summary: Cancel a task
      description: Stops a running task (through the orchestrator) or cancels a queued or blocked one. Final tasks are returned unchanged.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      responses:
        '200':
          description: The task after cancellation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '503':
          description: Store disabled, or a running task could not be stopped because the orchestrator is unavailable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }

  /api/v1/tasks/{id}/unblock:
    post:
      tags: [tasks]
      operationId: unblockTask
      summary: Re-queue a blocked or failed task
      description: The optional `message` (the operator's answer) is appended to the prompt as `Operator reply:`. Other statuses answer `409 task_conflict`, and so does a task with a failed or cancelled dependency (unblock that one first). A task whose dependencies have not all succeeded comes back `waiting`.
      parameters: [{ $ref: '#/components/parameters/TaskId' }]
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TaskUnblock' }
      responses:
        '200':
          description: The re-queued task.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        '400': { $ref: '#/components/responses/InvalidParameter' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '409':
          description: The task is neither blocked nor failed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEnvelope' }
              example:
                error: { code: task_conflict, message: 'task 3 is running; only blocked or failed tasks can be unblocked' }
        '503': { $ref: '#/components/responses/StoreDisabled' }

  /api/v1/tasks/{id}/events:
    get:
      tags: [tasks]
      operationId: streamTask
      summary: Watch a task (Server-Sent Events)
      description: |
        Starts with `retry: 3000`, then sends `event: task` (data: `Task`) whenever the record
        changes and `event: run_event` (data: `RunEvent`, `id: <run_id>-<seq>`) for every event
        its runs record. Comment keep-alives every 15 s. The stream ends once the task is
        `succeeded`, `failed` or `cancelled` and every event was sent. Browsers authenticate with
        `?ticket=` (see `POST /api/v1/events/tickets`).
      parameters:
        - { $ref: '#/components/parameters/TaskId' }
        - name: ticket
          in: query
          required: false
          schema: { type: string }
      responses:
        '200':
          description: Event stream.
          content:
            text/event-stream:
              schema: { type: string }
              x-sse-events:
                task:
                  schema: { $ref: '#/components/schemas/Task' }
                run_event:
                  schema: { $ref: '#/components/schemas/RunEvent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/TaskNotFound' }
        '503': { $ref: '#/components/responses/StoreDisabled' }

  /api/v1/runs:
    get:
      tags: [history]
      operationId: listRuns
      summary: Run history (newest first, keyset pagination)
      description: |
        Agent runs ordered by `id` descending. Pass `next_before_id` from a response as `before_id`
        to fetch the next (older) page; it is `null` on the last page.
      parameters:
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: before_id
          in: query
          description: Only runs with `id < before_id`.
          schema: { type: integer, minimum: 1 }
        - name: issue
          in: query
          description: Only runs whose `issue_identifier` equals this value (exact, case-sensitive).
          schema: { type: string, minLength: 1 }
        - name: status
          in: query
          description: Only runs with this status.
          schema:
            $ref: '#/components/schemas/RunStatus'
      responses:
        '200':
          description: One page of runs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunList'
              example:
                runs:
                  - id: 42
                    issue_id: issue-http
                    issue_identifier: MT-HTTP
                    issue_title: Render the HTTP dashboard
                    attempt: 0
                    worker_host: null
                    workspace_path: /tmp/symphony_workspaces/MT-HTTP
                    status: succeeded
                    error: null
                    turns: 7
                    started_at: '2026-02-24T20:10:12.004Z'
                    finished_at: '2026-02-24T20:31:40.250Z'
                    duration_ms: 1288246
                    tokens: { input: 18230, output: 2207, total: 20437 }
                    cost_micro_usd: 44858
                next_before_id: 42
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/StoreDisabled'

  /api/v1/runs/{id}:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [history]
      operationId: getRun
      summary: One run
      responses:
        '200':
          description: The run.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunRecord'
              examples:
                run:
                  $ref: '#/components/examples/RunRecord'
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/StoreDisabled'

  /api/v1/runs/{id}/events:
    parameters:
      - $ref: '#/components/parameters/RunId'
    get:
      tags: [history]
      operationId: listRunEvents
      summary: Timeline of one run (oldest first)
      description: |
        Events ordered by `seq` ascending (`seq` starts at 1 per run and has no gaps). To page,
        pass the last `seq` you received as `after_seq`; a page shorter than `limit` is the end
        (for a still-running run, poll again later).
      parameters:
        - name: after_seq
          in: query
          description: Only events with `seq > after_seq`.
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          description: Page size.
          schema: { type: integer, minimum: 1, maximum: 1000, default: 500 }
      responses:
        '200':
          description: Events page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunEventList'
              example:
                events:
                  - run_id: 42
                    seq: 1
                    at: '2026-02-24T20:10:12.004Z'
                    kind: session_started
                    message: session started (thread-http)
                    payload: { session_id: thread-http }
                  - run_id: 42
                    seq: 2
                    at: '2026-02-24T20:10:15.512Z'
                    kind: notification
                    message: rendered
                    payload: null
        '400':
          $ref: '#/components/responses/InvalidParameter'
        '404':
          $ref: '#/components/responses/RunNotFound'
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/StoreDisabled'

  /api/v1/totals:
    get:
      tags: [history]
      operationId: getTotals
      summary: All-time aggregates over the run history
      responses:
        '200':
          description: Aggregates (retention-pruned runs are no longer counted).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Totals'
              example:
                runs_total: 128
                runs_succeeded: 97
                runs_failed: 21
                tokens: { input: 1830211, output: 220407, total: 2050618 }
                runtime_ms: 48210933
                cost_micro_usd: 1520331
        '405':
          $ref: '#/components/responses/MethodNotAllowed'
        '503':
          $ref: '#/components/responses/StoreDisabled'

  /api/v1/{issue_identifier}:
    parameters:
      - name: issue_identifier
        in: path
        required: true
        description: Tracker identifier such as `MT-123` (URL-decoded, exact, case-sensitive).
        schema: { type: string }
    get:
      tags: [state]
      operationId: getIssue
      summary: Live detail of one issue known to the orchestrator
      description: |
        Looks the identifier up in `running`, then `retrying`, then `blocked`. Unknown issues, and
        any snapshot failure, answer `404 issue_not_found`.
      responses:
        '200':
          description: Issue detail.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IssueDetail'
              examples:
                running:
                  $ref: '#/components/examples/IssueDetail'
        '404':
          description: Issue is not running, retrying or blocked (or the snapshot failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                error: { code: issue_not_found, message: Issue not found }
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

  /api/openapi.json:
    get:
      tags: [meta]
      operationId: getOpenApi
      summary: This document, as JSON
      security: []
      responses:
        '200':
          description: OpenAPI 3.1 document.
          content:
            application/json:
              schema:
                type: object
        '405':
          $ref: '#/components/responses/MethodNotAllowed'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: The API token (`server.api_token` / `SYMPHONY_API_TOKEN`). Not required when the server runs without one (loopback only).

  parameters:
    TaskId:
      name: id
      in: path
      required: true
      description: Task id (positive integer). Non-integers answer `400 invalid_parameter`.
      schema: { type: integer, minimum: 1 }
    RunId:
      name: id
      in: path
      required: true
      description: Run id (positive integer). Non-integers answer `400 invalid_parameter`.
      schema: { type: integer, minimum: 1 }

  responses:
    Unauthorized:
      description: Missing or invalid API token (or SSE ticket).
      headers:
        WWW-Authenticate:
          schema: { type: string, const: 'Bearer realm="symphony"' }
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: unauthorized, message: Missing or invalid API token }
    Forbidden:
      description: The `Host` header is not allowed (`host_not_allowed`), or a browser write came from another origin (`origin_not_allowed`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: origin_not_allowed, message: Cross-origin request refused }
    MethodNotAllowed:
      description: The path exists but does not support this method.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: method_not_allowed, message: Method not allowed }
    RunNotFound:
      description: No run with this id (never existed or pruned by retention).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: run_not_found, message: Run not found }
    InvalidParameter:
      description: A path or query parameter failed validation. The message names the parameter.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: invalid_parameter, message: 'limit must be an integer between 1 and 200' }
    TaskNotFound:
      description: No task with this id.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: task_not_found, message: Task not found }
    StoreDisabled:
      description: Run history persistence is disabled in this process.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            error: { code: store_disabled, message: Run history store is disabled }

  schemas:
    ErrorEnvelope:
      type: object
      required: [error]
      additionalProperties: false
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    ErrorBody:
      type: object
      required: [code, message]
      additionalProperties: false
      properties:
        code:
          type: string
          description: Stable machine-readable code.
          examples: [not_found, method_not_allowed, issue_not_found, orchestrator_unavailable, run_not_found, invalid_parameter, store_disabled, request_failed, unauthorized, host_not_allowed, origin_not_allowed, task_not_found, task_conflict]
        message:
          type: string
          description: Human-readable text (not localized, may change).

    Timestamp:
      type: string
      format: date-time
      description: UTC RFC 3339 timestamp ending in `Z`.
      examples: ['2026-02-24T20:15:30Z']

    TokenUsage:
      type: object
      description: |
        Token counters as reported by the agent. Values may be `null` before the first usage update.
        `input_tokens` excludes prompt-cache reads, which are `cached_input_tokens`.
      required: [input_tokens, output_tokens, total_tokens]
      properties:
        input_tokens: { type: [integer, 'null'], minimum: 0 }
        cached_input_tokens: { type: [integer, 'null'], minimum: 0 }
        output_tokens: { type: [integer, 'null'], minimum: 0 }
        total_tokens: { type: [integer, 'null'], minimum: 0 }

    StatePayload:
      description: Body of `GET /api/v1/state` and of every SSE `snapshot` event.
      oneOf:
        - $ref: '#/components/schemas/StateSnapshot'
        - $ref: '#/components/schemas/StateError'

    StateError:
      type: object
      required: [generated_at, error]
      properties:
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [snapshot_timeout, snapshot_unavailable]
            message:
              type: string
              enum: [Snapshot timed out, Snapshot unavailable]

    StateSnapshot:
      type: object
      required: [generated_at, counts, running, retrying, blocked, codex_totals, rate_limits]
      properties:
        generated_at:
          $ref: '#/components/schemas/Timestamp'
        counts:
          type: object
          required: [running, retrying, blocked]
          properties:
            running: { type: integer, minimum: 0 }
            retrying: { type: integer, minimum: 0 }
            blocked: { type: integer, minimum: 0 }
        running:
          type: array
          items: { $ref: '#/components/schemas/RunningEntry' }
        retrying:
          type: array
          items: { $ref: '#/components/schemas/RetryEntry' }
        blocked:
          type: array
          items: { $ref: '#/components/schemas/BlockedEntry' }
        codex_totals:
          $ref: '#/components/schemas/CodexTotals'
        rate_limits:
          $ref: '#/components/schemas/RateLimits'
        spend:
          $ref: '#/components/schemas/Spend'

    Spend:
      type: object
      description: |
        Spend controls (new in the Rust port; absent when the orchestrator does not report them).
        Tokens count input + output. Costs use the `budget` prices in WORKFLOW.md.
      required: [paused, stopped_reason, day, day_tokens, day_cost_usd, total_cost_usd, max_tokens_per_day, max_cost_usd_per_day, max_tokens_per_issue, max_cost_usd_per_issue]
      additionalProperties: false
      properties:
        paused: { type: boolean, description: 'Kill switch engaged (`POST /api/v1/pause`).' }
        stopped_reason: { type: [string, 'null'], description: 'Why dispatch is held: the kill switch or an exhausted daily budget.' }
        day: { type: string, format: date, description: 'UTC day of the `day_*` counters.' }
        day_tokens: { type: integer, minimum: 0 }
        day_cost_usd: { type: number, minimum: 0 }
        total_cost_usd: { type: number, minimum: 0, description: 'All runs of this process.' }
        max_tokens_per_day: { type: [integer, 'null'], minimum: 1 }
        max_cost_usd_per_day: { type: [number, 'null'] }
        max_tokens_per_issue: { type: [integer, 'null'], minimum: 1 }
        max_cost_usd_per_issue: { type: [number, 'null'] }

    PauseState:
      type: object
      required: [paused, reason]
      additionalProperties: false
      properties:
        paused: { type: boolean }
        reason: { type: [string, 'null'] }

    CodexTotals:
      type: object
      description: |
        Aggregate token usage and runtime. `seconds_running` counts **ended** sessions only
        (Elixir parity); clients add `now - started_at` of each running row for a live total.
      required: [input_tokens, output_tokens, total_tokens, seconds_running]
      properties:
        input_tokens: { type: integer, minimum: 0, description: Prompt-cache reads excluded. }
        cached_input_tokens: { type: integer, minimum: 0, description: Prompt-cache reads. }
        output_tokens: { type: integer, minimum: 0 }
        total_tokens: { type: integer, minimum: 0 }
        seconds_running: { type: number, minimum: 0 }

    RateLimits:
      description: |
        Last rate-limit object reported by Codex, passed through verbatim (or `null`). Commonly
        `{limit_id?, limit_name?, primary?: Bucket, secondary?: Bucket, credits?: Credits}` where a
        bucket has `remaining`, `limit` and a reset hint (`reset_in_seconds` / `resetInSeconds` /
        `reset_at` / `resetAt` / `resets_at` / `resetsAt`) and credits has `unlimited`,
        `has_credits`, `balance`. Clients must tolerate any JSON value here.
      type: [object, 'null']
      additionalProperties: true

    RunningEntry:
      type: object
      required: [issue_id, issue_identifier, issue_url, state, worker_host, workspace_path, session_id, turn_count, last_event, last_message, started_at, last_event_at, tokens]
      properties:
        issue_id: { type: string }
        issue_identifier: { type: string }
        issue_url: { type: [string, 'null'] }
        state: { type: [string, 'null'], description: 'Tracker state name, e.g. `In Progress`.' }
        worker_host: { type: [string, 'null'], description: 'SSH worker host, `null` for local runs.' }
        workspace_path: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
        turn_count: { type: integer, minimum: 0 }
        last_event: { type: [string, 'null'], description: 'Last Codex event name, e.g. `notification`.' }
        last_message: { type: [string, 'null'], description: 'Humanized summary of the last Codex message (max ~143 chars).' }
        started_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        last_event_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        tokens: { $ref: '#/components/schemas/TokenUsage' }

    RetryEntry:
      type: object
      required: [issue_id, issue_identifier, issue_url, attempt, due_at, error, worker_host, workspace_path]
      properties:
        issue_id: { type: string }
        issue_identifier: { type: string }
        issue_url: { type: [string, 'null'] }
        attempt: { type: [integer, 'null'], minimum: 0 }
        due_at:
          description: Recomputed from `now + due_in` on each request (may jitter by 1 s).
          oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }]
        error: { type: [string, 'null'] }
        worker_host: { type: [string, 'null'] }
        workspace_path: { type: [string, 'null'] }

    BlockedEntry:
      type: object
      required: [issue_id, issue_identifier, issue_url, state, error, worker_host, workspace_path, session_id, blocked_at, last_event, last_message, last_event_at]
      properties:
        issue_id: { type: string }
        issue_identifier: { type: string }
        issue_url: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        worker_host: { type: [string, 'null'] }
        workspace_path: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
        blocked_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        last_event: { type: [string, 'null'] }
        last_message: { type: [string, 'null'] }
        last_event_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }

    IssueDetail:
      type: object
      required: [issue_identifier, issue_id, status, workspace, attempts, running, retry, blocked, logs, recent_events, last_error, tracked]
      properties:
        issue_identifier: { type: string }
        issue_id: { type: string }
        status:
          type: string
          enum: [running, retrying, blocked]
          description: '`running` wins over `retrying`, which wins over `blocked`.'
        workspace:
          type: object
          required: [path, host]
          properties:
            path: { type: string, description: 'First known workspace path, else `<workspace.root>/<workspace_key(identifier)>`.' }
            host: { type: [string, 'null'] }
        attempts:
          type: object
          required: [restart_count, current_retry_attempt]
          properties:
            restart_count: { type: integer, minimum: 0, description: '`max(current_retry_attempt - 1, 0)`.' }
            current_retry_attempt: { type: integer, minimum: 0 }
        running:
          oneOf:
            - $ref: '#/components/schemas/IssueRunning'
            - type: 'null'
        retry:
          oneOf:
            - $ref: '#/components/schemas/IssueRetry'
            - type: 'null'
        blocked:
          oneOf:
            - $ref: '#/components/schemas/IssueBlocked'
            - type: 'null'
        logs:
          type: object
          required: [codex_session_logs]
          properties:
            codex_session_logs:
              type: array
              description: Always empty (reserved).
              maxItems: 0
              items: {}
        recent_events:
          type: array
          description: At most one entry (the last Codex event of the running or blocked session).
          items:
            $ref: '#/components/schemas/RecentEvent'
        last_error: { type: [string, 'null'], description: '`blocked.error`, else `retry.error`.' }
        tracked:
          type: object
          description: Always `{}` (reserved).
          maxProperties: 0

    IssueRunning:
      type: object
      required: [worker_host, workspace_path, session_id, turn_count, state, started_at, last_event, last_message, last_event_at, tokens]
      properties:
        worker_host: { type: [string, 'null'] }
        workspace_path: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
        turn_count: { type: integer, minimum: 0 }
        state: { type: [string, 'null'] }
        started_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        last_event: { type: [string, 'null'] }
        last_message: { type: [string, 'null'] }
        last_event_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        tokens: { $ref: '#/components/schemas/TokenUsage' }

    IssueRetry:
      type: object
      required: [attempt, due_at, error, worker_host, workspace_path]
      properties:
        attempt: { type: [integer, 'null'] }
        due_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        error: { type: [string, 'null'] }
        worker_host: { type: [string, 'null'] }
        workspace_path: { type: [string, 'null'] }

    IssueBlocked:
      type: object
      required: [worker_host, workspace_path, session_id, state, error, blocked_at, last_event, last_message, last_event_at]
      properties:
        worker_host: { type: [string, 'null'] }
        workspace_path: { type: [string, 'null'] }
        session_id: { type: [string, 'null'] }
        state: { type: [string, 'null'] }
        error: { type: [string, 'null'] }
        blocked_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }
        last_event: { type: [string, 'null'] }
        last_message: { type: [string, 'null'] }
        last_event_at: { oneOf: [{ $ref: '#/components/schemas/Timestamp' }, { type: 'null' }] }

    RecentEvent:
      type: object
      required: [at, event, message]
      properties:
        at: { $ref: '#/components/schemas/Timestamp' }
        event: { type: [string, 'null'] }
        message: { type: [string, 'null'] }

    RefreshAccepted:
      type: object
      required: [queued, coalesced, requested_at, operations]
      properties:
        queued: { type: boolean, const: true }
        coalesced: { type: boolean }
        requested_at:
          type: string
          format: date-time
          description: Microsecond precision, `Z` suffix.
        operations:
          type: array
          items: { type: string }
          examples: [[poll, reconcile]]

    Health:
      type: object
      required: [status, version, uptime_seconds, store, auth_required]
      additionalProperties: false
      properties:
        auth_required: { type: boolean, description: 'Whether `/api/*` needs `Authorization: Bearer <token>`.' }
        status: { type: string, enum: [ok, degraded], description: '`degraded` when the store database connection is lost.' }
        version: { type: string, description: 'Crate version of the `symphony` binary.' }
        uptime_seconds: { type: integer, minimum: 0, description: 'Whole seconds since the HTTP server started.' }
        store:
          type: string
          enum: [sqlite, postgres, disabled]
          description: Whether run history endpoints are available, and which database serves them.

    TaskStatus:
      type: string
      description: '`waiting`: queued, but a task in `depends_on` has not succeeded yet.'
      enum: [queued, waiting, running, succeeded, failed, cancelled, blocked]

    TaskLimits:
      type: object
      required: [max_tokens, timeout_ms]
      additionalProperties: false
      properties:
        max_tokens: { type: [integer, 'null'], minimum: 1, description: 'Tokens (input + output) across the task''s runs; the run fails when it is reached.' }
        timeout_ms: { type: [integer, 'null'], minimum: 1, description: 'Wall-clock limit of one run.' }

    TaskCreate:
      type: object
      required: [prompt]
      additionalProperties: false
      properties:
        title: { type: [string, 'null'], maxLength: 200 }
        prompt: { type: string, minLength: 1, description: 'What the agent should do (at most 256 KiB).' }
        repo: { type: [string, 'null'], description: '`https://` or `ssh://` URL or `user@host:path`, shallow-cloned into the workspace. Omit for an empty workspace (non-coding tasks).' }
        branch: { type: [string, 'null'], description: 'Branch or tag to clone (needs `repo`).' }
        backend: { type: [string, 'null'], description: 'A `backends` entry of WORKFLOW.md; default `agent.backend`.' }
        limits:
          type: [object, 'null']
          additionalProperties: false
          properties:
            max_tokens: { type: [integer, 'null'], minimum: 1 }
            timeout_ms: { type: [integer, 'null'], minimum: 1 }
        metadata: { type: [object, 'null'], description: 'Free-form JSON kept with the task (at most 16 KiB).' }
        depends_on:
          type: array
          maxItems: 100
          items: { type: integer, minimum: 1 }
          description: 'Existing tasks that must succeed before this one runs.'
        retry:
          type: [object, 'null']
          additionalProperties: false
          description: 'Retry policy; every field is optional (defaults below).'
          properties:
            max_attempts: { type: integer, minimum: 1, maximum: 20, default: 3 }
            backoff_ms: { type: integer, minimum: 0, default: 10000 }
            max_backoff_ms: { type: integer, minimum: 0, default: 300000 }
            on:
              type: array
              items: { $ref: '#/components/schemas/TaskFailure' }
              default: [interrupted]

    TaskFailure:
      type: string
      description: |
        A kind of failed run: `error` (the agent's run failed), `timeout` (`timeout_ms` reached or
        the run stalled), `interrupted` (the replica running it stopped).
      enum: [error, timeout, interrupted]

    TaskRetry:
      type: object
      description: |
        A failed run of a kind in `on` runs again while fewer than `max_attempts` attempts have
        failed, after `backoff_ms * 2^(failed_attempts - 1)` (at most `max_backoff_ms`; at once
        after an interruption). Runs handed off on purpose (kill switch, daily budget, shutdown)
        do not count. Unblocking resets the count.
      required: [max_attempts, backoff_ms, max_backoff_ms, on]
      additionalProperties: false
      properties:
        max_attempts: { type: integer, minimum: 1, maximum: 20 }
        backoff_ms: { type: integer, minimum: 0 }
        max_backoff_ms: { type: integer, minimum: 0 }
        on:
          type: array
          items: { $ref: '#/components/schemas/TaskFailure' }

    TaskUnblock:
      type: object
      additionalProperties: false
      properties:
        message: { type: [string, 'null'], description: 'Operator reply appended to the prompt.' }

    Task:
      type: object
      required: [id, identifier, title, prompt, repo, branch, backend, limits, metadata, depends_on, status, result, error, attempts, retry, failed_attempts, next_attempt_at, created_at, updated_at, started_at, finished_at]
      additionalProperties: false
      properties:
        id: { type: integer, minimum: 1 }
        identifier: { type: string, description: '`task-<id>`: the identifier of its runs and live entries.' }
        title: { type: [string, 'null'] }
        prompt: { type: string }
        repo: { type: [string, 'null'] }
        branch: { type: [string, 'null'] }
        backend: { type: [string, 'null'] }
        limits: { $ref: '#/components/schemas/TaskLimits' }
        metadata: { type: [object, 'null'] }
        depends_on:
          type: array
          items: { type: integer, minimum: 1 }
          description: 'Tasks that must succeed before this one runs (ascending ids).'
        status: { $ref: '#/components/schemas/TaskStatus' }
        result: { type: [string, 'null'], description: 'Final agent message of a succeeded task.' }
        error: { type: [string, 'null'] }
        attempts: { type: integer, minimum: 0, description: 'Runs started so far.' }
        retry: { $ref: '#/components/schemas/TaskRetry' }
        failed_attempts: { type: integer, minimum: 0, description: 'Failed attempts counted against `retry.max_attempts` since creation or the last unblock.' }
        next_attempt_at: { type: [string, 'null'], format: date-time, description: 'When a retried task may run again; `null`: as soon as a slot is free.' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        started_at: { type: [string, 'null'], format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }

    TaskPlanDependency:
      description: A planned task's key (string) or an existing task's id (integer).
      oneOf:
        - { type: string, minLength: 1, maxLength: 128 }
        - { type: integer, minimum: 1 }

    TaskPlanRequest:
      type: object
      required: [tasks]
      additionalProperties: false
      properties:
        tasks:
          type: array
          maxItems: 1000
          items:
            type: object
            required: [key]
            additionalProperties: false
            properties:
              key: { type: string, minLength: 1, maxLength: 128 }
              depends_on:
                type: array
                maxItems: 100
                items: { $ref: '#/components/schemas/TaskPlanDependency' }

    TaskPlan:
      type: object
      required: [order, waves, tasks]
      additionalProperties: false
      properties:
        order: { type: array, items: { type: string } }
        waves:
          type: array
          items: { type: array, items: { type: string } }
        tasks:
          type: array
          description: The planned tasks, in request order.
          items:
            type: object
            required: [key, wave, status, waiting_for, failed_dependency]
            additionalProperties: false
            properties:
              key: { type: string }
              wave: { type: integer, minimum: 0 }
              status: { type: string, enum: [queued, waiting, failed] }
              waiting_for:
                type: array
                items: { $ref: '#/components/schemas/TaskPlanDependency' }
              failed_dependency:
                oneOf:
                  - { $ref: '#/components/schemas/TaskPlanDependency' }
                  - { type: 'null' }

    TaskPage:
      type: object
      required: [tasks, next_before_id]
      additionalProperties: false
      properties:
        tasks:
          type: array
          items: { $ref: '#/components/schemas/Task' }
        next_before_id: { type: [integer, 'null'] }

    SseTicket:
      type: object
      required: [ticket, expires_at, expires_in_ms]
      additionalProperties: false
      properties:
        ticket: { type: string, description: 'Pass as `?ticket=` to a stream endpoint; valid once.' }
        expires_at: { type: string, format: date-time }
        expires_in_ms: { type: integer, minimum: 0 }

    RunStatus:
      type: string
      enum: [running, succeeded, failed, cancelled, blocked]

    RunTokens:
      type: object
      description: |
        `input` excludes prompt-cache reads, which are `cached`. Runs recorded before cache reads
        were metered apart have `cached: 0` and count them in `input`.
      required: [input, output, total]
      additionalProperties: false
      properties:
        input: { type: integer, minimum: 0 }
        cached: { type: integer, minimum: 0 }
        output: { type: integer, minimum: 0 }
        total: { type: integer, minimum: 0 }

    RunRecord:
      type: object
      description: One agent run (one attempt of one issue).
      required: [id, issue_id, issue_identifier, issue_title, attempt, worker_host, workspace_path, status, error, turns, started_at, finished_at, duration_ms, tokens, cost_micro_usd]
      additionalProperties: false
      properties:
        id: { type: integer, minimum: 1 }
        issue_id: { type: string }
        issue_identifier: { type: string }
        issue_title: { type: [string, 'null'] }
        attempt: { type: integer, minimum: 0, description: '0 for the first dispatch, then the retry attempt number.' }
        worker_host: { type: [string, 'null'] }
        workspace_path: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/RunStatus' }
        error: { type: [string, 'null'] }
        turns: { type: integer, minimum: 0 }
        started_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time, description: '`null` while `status` is `running`.' }
        duration_ms: { type: [integer, 'null'], minimum: 0, description: '`finished_at - started_at`; `null` while running.' }
        tokens: { $ref: '#/components/schemas/RunTokens' }
        cost_micro_usd: { type: integer, minimum: 0, description: 'Cost of `tokens` in micro-USD at the `budget` prices in force when the run started (`0` without prices).' }

    RunList:
      type: object
      required: [runs, next_before_id]
      additionalProperties: false
      properties:
        runs:
          type: array
          items: { $ref: '#/components/schemas/RunRecord' }
        next_before_id:
          type: [integer, 'null']
          description: Pass as `before_id` to get the next (older) page; `null` when there are no more runs.

    RunEvent:
      type: object
      required: [run_id, seq, at, kind, message, payload]
      additionalProperties: false
      properties:
        run_id: { type: integer, minimum: 1 }
        seq: { type: integer, minimum: 1 }
        at: { type: string, format: date-time }
        kind:
          type: string
          description: |
            Event kind, e.g. `session_started`, `turn_completed`, `notification`, `tool_call`,
            `token_usage`, `turn_input_required`, `run_finished`. Open set; render unknown kinds verbatim.
        message: { type: [string, 'null'], description: 'Humanized one-line summary.' }
        payload:
          description: Raw structured payload (secrets scrubbed) or `null`.
          type: [object, array, string, number, boolean, 'null']

    RunEventList:
      type: object
      required: [events]
      additionalProperties: false
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/RunEvent' }

    Totals:
      type: object
      required: [runs_total, runs_succeeded, runs_failed, tokens, runtime_ms, cost_micro_usd]
      additionalProperties: false
      properties:
        runs_total: { type: integer, minimum: 0 }
        runs_succeeded: { type: integer, minimum: 0 }
        runs_failed: { type: integer, minimum: 0 }
        tokens: { $ref: '#/components/schemas/RunTokens' }
        runtime_ms: { type: integer, minimum: 0, description: 'Sum of `duration_ms` of finished runs.' }
        cost_micro_usd: { type: integer, minimum: 0, description: 'Sum of run costs in micro-USD.' }

