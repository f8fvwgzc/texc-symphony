[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/f8fvwgzc/texc-symphony"
authors = ["Symphony contributors"]

[workspace.dependencies]
# internal crates
symphony-core = { path = "crates/symphony-core" }
symphony-trackers = { path = "crates/symphony-trackers" }
symphony-codex = { path = "crates/symphony-codex" }
symphony-runtime = { path = "crates/symphony-runtime" }
symphony-store = { path = "crates/symphony-store" }
symphony-server = { path = "crates/symphony-server" }

# shared third-party versions (crates opt in with `workspace = true`)
anyhow = "1.0.104"
thiserror = "2.0.21"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "sync", "fs", "io-util", "net"] }
tokio-util = { version = "0.7.19", features = ["rt"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
futures = "0.3.34"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
arc-swap = "1.9.2"
async-trait = "0.1.92"
serde_yaml_ng = "0.10.0"
liquid = "0.26.11"
sha2 = "0.11.0"
hex = "0.4.3"
libc = "0.2"
tempfile = "3.27.0"
# HTTP stack (symphony-trackers)
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "http2", "gzip", "brotli"] }
url = "2.5.8"
percent-encoding = "2.3.2"
base64 = "0.23.1"
httpdate = "1.0.3"
wiremock = "0.6.5"
# HTTP server stack (symphony-server)
axum = "0.8.9"
tower = "0.5.3"
tower-http = "0.7.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
