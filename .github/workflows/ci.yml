name: ci

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: short
  IMAGE_NAME: ghcr.io/${{ github.repository }}

jobs:
  rust-lint:
    name: rust (fmt + clippy)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@1.99.0 # branch pinned to the toolchain in rust-toolchain.toml
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # v2.9.2
        with:
          shared-key: lint

      - name: cargo fmt --check
        run: make fmt-check

      - name: cargo clippy -D warnings
        run: make lint

  rust-test:
    name: rust test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@1.99.0 # branch pinned to the toolchain in rust-toolchain.toml

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # v2.9.2
        with:
          shared-key: test

      # symphony-server embeds a placeholder page when web/dist is absent, so the Rust jobs do not
      # wait for the web build.
      - name: cargo test
        run: make test

  web:
    name: web (check + build)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@v6 # v6.1.0; version comes from web/package.json "packageManager"
        with:
          package_json_file: web/package.json

      - name: Install Node.js 22
        uses: actions/setup-node@v7 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: pnpm install --frozen-lockfile
        run: pnpm --dir web install --frozen-lockfile

      - name: pnpm check (typecheck, oxlint, vitest)
        run: pnpm --dir web check

      - name: pnpm build
        run: pnpm --dir web build

      - name: Upload web/dist
        uses: actions/upload-artifact@v7 # v7.0.1
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 7

  docker:
    name: docker (linux/amd64 + linux/arm64)
    runs-on: ubuntu-24.04
    needs: [rust-lint, web]
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1

      # Rust is cross-compiled on the runner (tonistiigi/xx); QEMU only runs the runtime stage's
      # apt-get for the non-native architecture.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4 # v4.4.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4 # v4.4.1

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v4 # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=raw,value=edge,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short

      - name: Build (and push on main)
        uses: docker/build-push-action@v7 # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=symphony-image
          cache-to: type=gha,scope=symphony-image,mode=max

  pr-description:
    name: pr description
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust 1.99.0
        uses: dtolnay/rust-toolchain@1.99.0 # branch pinned to the toolchain in rust-toolchain.toml

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2 # v2.9.2
        with:
          shared-key: xtask

      # The body is read from the API, not the event payload, so after editing the description a
      # plain "Re-run job" validates the new text (no `edited` trigger that would re-run, or skip
      # and thereby mask, the other jobs).
      - name: Validate PR description against .github/pull_request_template.md
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq '.body // ""' > "$RUNNER_TEMP/pr_body.md"
          cargo run --quiet --locked -p xtask -- pr-body-check --file "$RUNNER_TEMP/pr_body.md"
